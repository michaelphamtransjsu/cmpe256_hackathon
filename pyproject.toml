[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-corporate-specialists"
version = "0.1.0"
description = "Independent, evidence-based Clinical and Corporate Responsibility specialists"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "pypdf>=6.0,<7",
  "fonttools>=4.60,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
specialist-ingest = "ingest:main"
clinical-specialist = "agents.clinical:main"
corporate-responsibility-specialist = "agents.corporate_responsibility:main"

[tool.setuptools]
py-modules = ["ingest", "manager"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "shared*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
